version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: kasai-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kasai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kasai_secret}
      POSTGRES_DB: ${POSTGRES_DB:-kasai_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kasai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile # Omit if deploying via Coolify Nixpacks, only needed for raw Docker deployments
    container_name: kasai-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-kasai}:${POSTGRES_PASSWORD:-kasai_secret}@db:5432/${POSTGRES_DB:-kasai_db}?schema=public
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEMO_MODE=${DEMO_MODE:-false}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - DEMO_BUSINESS_ID=${DEMO_BUSINESS_ID:-biz_demo_001}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
